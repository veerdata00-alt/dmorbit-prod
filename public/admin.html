<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMOrbit | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #334155;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #833ab4;
            --secondary: #fd1d1d;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.5;
            overflow-x: hidden;
        }

        .admin-wrapper {
            width: 100%;
            padding: 32px;
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 24px; 
            margin-bottom: 48px; 
        }

        .stat-card { 
            background: var(--surface); 
            padding: 32px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            text-align: left;
            transition: transform 0.2s ease;
        }

        .stat-card:hover { transform: translateY(-4px); border-color: var(--primary); }

        .stat-value { font-size: 40px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .stat-label { color: var(--text-muted); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        
        section { 
            margin-bottom: 48px; 
            background: var(--surface); 
            border-radius: 24px; 
            border: 1px solid var(--border); 
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        h2 { 
            padding: 24px 32px; 
            margin: 0; 
            background: rgba(255,255,255,0.02); 
            border-bottom: 1px solid var(--border); 
            font-size: 20px; 
            font-weight: 700;
        }
        
        .table-responsive { width: 100%; overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 800px; }
        th, td { padding: 18px 32px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(255,255,255,0.03); color: var(--text-muted); font-weight: 600; font-size: 13px; text-transform: uppercase; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .badge-active { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge-inactive { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        
        .btn-logout { background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .btn-logout:hover { opacity: 0.9; }

        .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-right: 12px; transition: background 0.2s; }
        .btn-ghost:hover { background: var(--surface2); }

        @media (max-width: 768px) {
            .admin-wrapper { padding: 20px 16px; }
            .stats-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 20px; text-align: center; }
            .stat-card { padding: 24px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <header>
            <h1>Admin Panel</h1>
            <div>
                <button class="btn-ghost" onclick="location.href='/dashboard.html'">User Dashboard</button>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <div id="error-box" class="error hidden" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 16px; border-radius: 12px; margin-bottom: 32px;"></div>

        <div class="stats-grid" id="stats-container">
            <div class="stat-card"><div class="stat-value" id="stat-users">-</div><div class="stat-label">Total Users</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-autos">-</div><div class="stat-label">Automations</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-dms">-</div><div class="stat-label">DMs Sent</div></div>
        </div>

        <section>
            <h2>User Management</h2>
            <div class="table-responsive" id="users-table-container">
                <div style="padding: 40px; text-align: center; color: var(--text-muted);">Loading users...</div>
            </div>
        </section>

        <section>
            <h2>Active Automations</h2>
            <div class="table-responsive" id="autos-table-container">
                <div style="padding: 40px; text-align: center; color: var(--text-muted);">Loading automations...</div>
            </div>
        </section>

        <section>
            <h2>Recent Activity Logs</h2>
            <div class="table-responsive" id="logs-table-container">
                <div style="padding: 40px; text-align: center; color: var(--text-muted);">Loading logs...</div>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        let auth;
        async function initFirebase() {
            try {
                const res = await fetch('/api/firebase-config');
                const config = await res.json();
                const app = initializeApp(config);
                auth = getAuth(app);
            } catch (err) {}
        }

        async function logout() {
            if (auth) await signOut(auth).catch(() => {});
            await fetch('/api/logout', { method: 'POST' });
            localStorage.clear();
            window.location.href = '/';
        }
        window.logout = logout;

        async function fetchData(url) {
            const res = await fetch(url);
            if (!res.ok) {
                if (res.status === 403 || res.status === 401) { window.location.href = '/'; return; }
                throw new Error('Failed to load data');
            }
            return res.json();
        }

        initFirebase();

        async function init() {
            try {
                const [stats, users, autos, logs] = await Promise.all([
                    fetchData('/api/admin/stats'),
                    fetchData('/api/admin/users'),
                    fetchData('/api/admin/automations'),
                    fetchData('/api/admin/logs')
                ]);

                document.getElementById('stat-users').textContent = stats.totalUsers;
                document.getElementById('stat-autos').textContent = stats.totalAutomations;
                document.getElementById('stat-dms').textContent = stats.totalDMs;

                document.getElementById('users-table-container').innerHTML = `
                    <table>
                        <thead><tr><th>Email</th><th>Name</th><th>IG Linked</th><th>Role</th><th>Joined</th></tr></thead>
                        <tbody>${users.map(u => `<tr><td>${u.email}</td><td>${u.name || '-'}</td><td>${u.instagramConnected ? '✅' : '❌'}</td><td>${u.role}</td><td>${new Date(u.createdAt).toLocaleDateString()}</td></tr>`).join('')}</tbody>
                    </table>`;

                document.getElementById('autos-table-container').innerHTML = `
                    <table>
                        <thead><tr><th>Name</th><th>Owner</th><th>Keywords</th><th>Status</th><th>Count</th></tr></thead>
                        <tbody>${autos.map(a => `<tr><td>${a.name}</td><td>${a.ownerEmail}</td><td>${(a.keywords || []).join(', ')}</td><td><span class="badge ${a.isActive ? 'badge-active' : 'badge-inactive'}">${a.isActive ? 'Active' : 'Paused'}</span></td><td>${a.triggerCount}</td></tr>`).join('')}</tbody>
                    </table>`;

                document.getElementById('logs-table-container').innerHTML = `
                    <table>
                        <thead><tr><th>Time</th><th>User</th><th>Keyword</th><th>Status</th></tr></thead>
                        <tbody>${logs.dmLogs.slice(0, 15).map(l => `<tr><td>${new Date(l.timestamp).toLocaleTimeString()}</td><td>${l.user_id}</td><td>${l.keyword}</td><td>✅ Sent</td></tr>`).join('')}</tbody>
                    </table>`;
            } catch (err) {
                document.getElementById('error-box').textContent = err.message;
                document.getElementById('error-box').classList.remove('hidden');
            }
        }
        init();
    </script>
</body>
</html>
