<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMOrbit | Admin Panel</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --primary: #833ab4;
            --border: rgba(255,255,255,0.1);
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-value { font-size: 32px; font-weight: bold; color: var(--primary); }
        .stat-label { color: #94a3b8; font-size: 14px; }
        
        section { margin-bottom: 40px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        h2 { padding: 20px; margin: 0; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); font-size: 18px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 20px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(255,255,255,0.05); color: #94a3b8; font-weight: 500; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-inactive { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        .loading { padding: 40px; text-align: center; color: #94a3b8; }
        .error { padding: 20px; background: rgba(239, 68, 68, 0.1); color: #f87171; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Admin Overview</h1>
            <div>
                <button onclick="location.href='/dashboard.html'" style="padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: white; cursor: pointer; margin-right: 10px;">User Dashboard</button>
                <button onclick="logout()" style="padding: 8px 16px; border-radius: 8px; border: none; background: #ef4444; color: white; cursor: pointer; font-weight: 600;">Logout</button>
            </div>
        </header>

        <div id="error-box" class="error" style="display: none;"></div>

        <div class="stats-grid" id="stats-container">
            <div class="stat-card"><div class="stat-value" id="stat-users">-</div><div class="stat-label">Total Users</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-autos">-</div><div class="stat-label">Automations</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-dms">-</div><div class="stat-label">DMs Sent</div></div>
        </div>

        <section>
            <h2>User Management</h2>
            <div id="users-table-container">
                <div class="loading">Loading users...</div>
            </div>
        </section>

        <section>
            <h2>All Automations</h2>
            <div id="autos-table-container">
                <div class="loading">Loading automations...</div>
            </div>
        </section>

        <section>
            <h2>System Logs (Recent)</h2>
            <div id="logs-table-container">
                <div class="loading">Loading logs...</div>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        let auth;

        async function initFirebase() {
            try {
                const res = await fetch('/api/firebase-config');
                const config = await res.json();
                const app = initializeApp(config);
                auth = getAuth(app);
            } catch (err) {
                console.error("Firebase init failed:", err);
            }
        }

        async function logout() {
            try {
                // 1. Sign out from Firebase client
                if (auth) {
                    await signOut(auth);
                }
                
                // 2. Clear backend session cookie
                const res = await fetch('/api/logout', { method: 'POST' });
                
                // 3. Clear local storage
                localStorage.clear();
                
                window.location.href = '/';
            } catch (err) {
                console.error("Logout failed:", err);
                window.location.href = '/';
            }
        }

        // Attach to window so it's accessible from onclick
        window.logout = logout;

        async function fetchData(url) {
            const res = await fetch(url);
            if (!res.ok) {
                if (res.status === 403 || res.status === 401) {
                    location.href = '/';
                    return;
                }
                throw new Error(`Failed to fetch ${url}`);
            }
            return res.json();
        }

        initFirebase();

        async function init() {
            try {
                const [stats, users, autos, logs] = await Promise.all([
                    fetchData('/api/admin/stats'),
                    fetchData('/api/admin/users'),
                    fetchData('/api/admin/automations'),
                    fetchData('/api/admin/logs')
                ]);

                // Render Stats
                document.getElementById('stat-users').textContent = stats.totalUsers;
                document.getElementById('stat-autos').textContent = stats.totalAutomations;
                document.getElementById('stat-dms').textContent = stats.totalDMs;

                // Render Users
                const usersCont = document.getElementById('users-table-container');
                usersCont.innerHTML = `
                    <table>
                        <thead>
                            <tr><th>Email</th><th>Name</th><th>Created</th><th>Role</th><th>IG Status</th></tr>
                        </thead>
                        <tbody>
                            ${users.map(u => `
                                <tr>
                                    <td>${u.email}</td>
                                    <td>${u.name || '-'}</td>
                                    <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                                    <td>${u.role}</td>
                                    <td>${u.instagramConnected ? '✅ Linked' : '❌ No'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                // Render Automations
                const autosCont = document.getElementById('autos-table-container');
                autosCont.innerHTML = `
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Owner</th><th>Keywords</th><th>Status</th><th>Triggers</th></tr>
                        </thead>
                        <tbody>
                            ${autos.map(a => `
                                <tr>
                                    <td>${a.name}</td>
                                    <td>${a.ownerEmail}</td>
                                    <td>${a.keywords.join(', ')}</td>
                                    <td><span class="badge ${a.isActive ? 'badge-active' : 'badge-inactive'}">${a.isActive ? 'Active' : 'Paused'}</span></td>
                                    <td>${a.triggerCount}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                // Render Logs
                const logsCont = document.getElementById('logs-table-container');
                logsCont.innerHTML = `
                    <table>
                        <thead>
                            <tr><th>Time</th><th>User ID</th><th>Keyword</th><th>Status</th></tr>
                        </thead>
                        <tbody>
                            ${logs.dmLogs.map(l => `
                                <tr>
                                    <td>${new Date(l.timestamp).toLocaleTimeString()}</td>
                                    <td>${l.user_id}</td>
                                    <td>${l.keyword}</td>
                                    <td>✅ Sent</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

            } catch (err) {
                const errorBox = document.getElementById('error-box');
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
                console.error(err);
            }
        }

        init();
    </script>
</body>
</html>
