<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: rgba(24, 24, 27, 0.7);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.1);
            --ring: rgba(79, 70, 229, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .creator-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #27272a;
            margin: 0 auto 24px auto;
            border: 2px solid var(--border);
            object-fit: cover;
            display: none; /* hidden until loaded */
        }

        .avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6);
            margin: 0 auto 24px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--ring);
            background: rgba(0, 0, 0, 0.5);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 16px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #4b5563;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-branding {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.6;
        }
        
        .footer-branding a {
            color: inherit;
            text-decoration: none;
            font-weight: 600;
        }

        /* Error state */
        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card" id="capture-card">
            <div id="avatar-container">
                <div class="avatar-placeholder" id="avatar-initials">?</div>
                <img src="" alt="Creator" class="creator-avatar" id="avatar-img">
            </div>
            
            <h1 id="title-text">Unlock Access</h1>
            <p id="subtitle-text">Enter your details below to receive your link instantly.</p>

            <form id="capture-form">
                <div class="form-group" id="group-name">
                    <label for="name">First Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Jane" required>
                </div>
                
                <div class="form-group" id="group-email">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
                </div>

                <div class="form-group" id="group-phone" style="display: none;">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+1 (555) 000-0000">
                </div>

                <div class="error-message" id="error-msg"></div>

                <button type="submit" class="btn-submit" id="submit-btn">
                    <span id="btn-text">Get Access</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </form>
        </div>
        
        <div class="footer-branding">
            Powered by <a href="/">DMOrbit</a>
        </div>
    </div>

    <script>
        // Extract automationId from URL: /c/:automationId
        const pathParts = window.location.pathname.split('/');
        const automationId = pathParts[pathParts.length - 1];

        // Fetch automation config to customize form
        async function initForm() {
            try {
                // If automationId is missing or "capture.html", bail out
                if (!automationId || automationId === 'capture.html') return;
                
                const res = await fetch(`/api/capture/config/${automationId}`);
                if (!res.ok) throw new Error("Config not found");
                
                const data = await res.json();
                
                // Customize UI
                if (data.creatorName) {
                    document.getElementById('avatar-initials').innerText = data.creatorName[0].toUpperCase();
                    document.getElementById('title-text').innerText = `Access ${data.creatorName}'s Link`;
                }
                if (data.avatarUrl) {
                    document.getElementById('avatar-img').src = data.avatarUrl;
                    document.getElementById('avatar-img').style.display = 'block';
                    document.getElementById('avatar-initials').style.display = 'none';
                }
                
                if (data.campaignName) {
                    document.getElementById('subtitle-text').innerText = `Register for ${data.campaignName} below.`;
                }
                
                // Show/hide fields based on config
                const fields = data.leadFields || ['email'];
                if (fields.includes('phone')) {
                    document.getElementById('group-phone').style.display = 'block';
                    document.getElementById('phone').required = true;
                }
                if (!fields.includes('email')) {
                    document.getElementById('group-email').style.display = 'none';
                    document.getElementById('email').required = false;
                }
                
            } catch (err) {
                console.error("Failed to load config", err);
            }
        }

        initForm();

        document.getElementById('capture-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');
            const errorMsg = document.getElementById('error-msg');
            
            // UI Loading state
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            errorMsg.style.display = 'none';
            
            const urlParams = new URLSearchParams(window.location.search);
            
            const payload = {
                automationId,
                sourcePost: urlParams.get('post') || undefined,
                triggerKeyword: urlParams.get('kw') || undefined,
                name: document.getElementById('name').value,
                email: document.getElementById('email') ? document.getElementById('email').value : undefined,
                phone: document.getElementById('phone') ? document.getElementById('phone').value : undefined
            };

            try {
                const res = await fetch('/api/leads/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (res.ok && data.success && data.redirectUrl) {
                    // Success! Redirect to the final link
                    btnText.innerText = 'Redirecting...';
                    btnText.style.display = 'block';
                    spinner.style.display = 'none';
                    window.location.href = data.redirectUrl;
                } else {
                    throw new Error(data.error || 'Failed to submit form');
                }
            } catch (err) {
                // Error state
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
                errorMsg.innerText = err.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
